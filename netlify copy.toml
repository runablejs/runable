[build]
  command = "pnpm build && pnpm --filter runable-website app:build && node website/scripts/stage-netlify-output.mjs"
  publish = "website/.output/client"

[build.environment]
  NODE_VERSION = "24.12.0"
  PNPM_VERSION = "11.10.0"
  NODE_ENV = "production"

[functions]
  directory = "website/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["better-sqlite3"]
  included_files = [
    ".output/manifest.js",
    ".output/server/**"
  ]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/index"
  status = 200

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
