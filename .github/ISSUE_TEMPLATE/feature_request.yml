name: Feature request
description: Suggest a new capability for Runable
title: "feat: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Runable.

        Feature requests should focus first on the problem and use case, not only on a proposed implementation.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Describe the use case or situation that motivated this request.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you currently facing?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like Runable to provide.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example API
      description: If applicable, show what the developer experience could look like.
      render: ts

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing workarounds or alternative designs you considered.

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: Who would benefit from this feature and how?
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for similar proposals.
          required: true
        - label: This request describes a concrete use case rather than only an implementation preference.
          required: true
